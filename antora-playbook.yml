site:
  title: RepoLabs Docs
  url: https://docs.repolab.dev
  start_page: repolabs::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://repolab.dev
    site_home_label: RepoLab home
    header_doc_title: RepoLabs Docs

antora:
  extensions:
    - '@antora/lunr-extension'
    - '@antora-supplemental/build-stack'

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: docs

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

asciidoc:
  attributes:
    stem: latexmath
    experimental: ""
    idprefix: ""
    idseparator: "-"
    page-pagination: ""

output:
  dir: build/site
